server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/orders {
    proxy_pass http://tasking:8080;
  }

  location /api/feasibility {
    proxy_pass http://tasking:8080;
  }

  location /api/ {
    proxy_pass http://constellation:8080;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
